name: Render reels
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["reels/**"]
permissions:
  contents: write
concurrency:
  group: render-reels
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check for pending jobs
        id: check
        run: python3 tools/render_jobs.py --check >> "$GITHUB_OUTPUT"
      - name: Install tools
        if: steps.check.outputs.pending == '1'
        timeout-minutes: 5
        run: |
          pip install -q pillow imageio-ffmpeg
          echo "FFMPEG=$(python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
          mkdir -p /tmp/fonts
          for f in ArchivoBlack-Regular DMSerifDisplay-Regular Lato-Bold Lato-Regular; do
            curl -sSfL -A "Mozilla/5.0 reel-bot" -o /tmp/fonts/$f.ttf https://chinacargohub.com/wp-content/uploads/ccb-bot/fonts/$f.ttf || true
          done
          echo "FONT_DIR=/tmp/fonts" >> "$GITHUB_ENV"
          ls -la /tmp/fonts
      - name: Render and publish
        if: steps.check.outputs.pending == '1'
        run: |
          git config user.name "reel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/render_jobs.py --render
        timeout-minutes: 10
