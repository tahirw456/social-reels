name: Render reels
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["reels/**"]
permissions:
  contents: write
concurrency:
  group: render-reels
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check for pending jobs
        id: check
        run: python3 tools/render_jobs.py --check >> "$GITHUB_OUTPUT"
      - name: Install tools
        if: steps.check.outputs.pending == '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-dejavu-core > /dev/null
          pip install -q pillow
      - name: Render and publish
        if: steps.check.outputs.pending == '1'
        run: |
          git config user.name "reel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/render_jobs.py --render
